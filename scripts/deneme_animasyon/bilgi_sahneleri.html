<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}</style></head>
<body><svg id="sv" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Bilgi sahneleri (B): ?s=35 patent, ?s=36 para sayacı
const SC=new URLSearchParams(location.search).get('s')||'35';
const PATENT='../../medya/sutyen/gorsel/arsiv/s35-patent-cizim-1.png'; // 2320x3408
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const back=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const INK='#2A1D16',TEAL='#6B4A32',TEALD='#3B2A1E',GOLD='#D9A441',CORAL='#E06A50',CREAM='#F8EED8',PAPER='#EADBC0';
const DEFS=`<defs>
 <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .3  0 0 0 0 .2  0 0 0 .15 0"/></filter>
 <radialGradient id="tealbg" cx="50%" cy="45%" r="80%"><stop offset="0" stop-color="#8A6444"/><stop offset=".7" stop-color="${TEAL}"/><stop offset="1" stop-color="#2E1F14"/></radialGradient>
 <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#1a0f08" stop-opacity=".5"/></radialGradient>
 <filter id="sh" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="10" dy="14" stdDeviation="10" flood-opacity=".35"/></filter>
</defs>`;
const sub=s=>s?`<text x="960" y="1020" text-anchor="middle" font-family="Inter" font-weight="800" font-size="52" fill="#fff" stroke="#111" stroke-width="11" paint-order="stroke" stroke-linejoin="round">${s}</text>`:'';
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');

const SCENES={
 '35':{DUR:6.0, render(t){
   // Masa üstünde patent sayfası kayarak gelir, kamera başlığa yaklaşır, damga basılır
   const inK=ease(seg(t,0,0.9));
   const pw=900, ph=pw*3408/2320;
   const z=1+0.9*ease(seg(t,1.2,3.4));                   // yakınlaşma
   const focusY=ph*0.11;                                    // başlık bölgesi
   const px=960-pw/2, py=lerpY(t)*0+ (1080-ph)/2 + (1-inK)*700;
   function lerpY(){return 0}
   // kamera: sayfa merkezinden başlığa
   const cy=(py+ph/2)+( (py+focusY) - (py+ph/2) )*ease(seg(t,1.2,3.4));
   let shx=0,shy=0; if(t>4.0&&t<4.35){const a=1-seg(t,4.0,4.35);shx=Math.sin(t*90)*9*a;shy=Math.cos(t*70)*7*a;}
   const stK=seg(t,3.75,4.05), stS=4-3*ease(stK), stO=clamp(stK*3);
   const s = t<0.3?'':(t<3.0?'12 Şubat 1914: patent başvurusu.':'Kasım 1914: patent onaylandı. No. 1.115.674');
   return `${DEFS}<rect width="1920" height="1080" fill="${TEALD}"/>
    <g transform="translate(${960+shx},${540+shy}) scale(${z}) translate(-960,${-cy})">
      <g transform="rotate(${-2+2*inK} 960 540)" filter="url(#sh)">
        <rect x="${px-16}" y="${py-16}" width="${pw+32}" height="${ph+32}" fill="#F3EAD6"/>
        <image href="${PATENT}" x="${px}" y="${py}" width="${pw}" height="${ph}" style="mix-blend-mode:multiply"/>
      </g>
    </g>
    ${stO>0?`<g transform="translate(${1380+shx},${300+shy}) rotate(-10) scale(${stS})" opacity="${stO}">
      <rect x="-300" y="-90" width="600" height="180" rx="14" fill="${CREAM}" fill-opacity=".85" stroke="${CORAL}" stroke-width="12"/>
      <rect x="-282" y="-72" width="564" height="144" rx="8" fill="none" stroke="${CORAL}" stroke-width="4"/>
      <text x="0" y="-8" text-anchor="middle" font-family="Inter Display,Inter" font-weight="900" font-size="66" fill="${CORAL}" letter-spacing="4">PATENT · 1914</text>
      <text x="0" y="52" text-anchor="middle" font-family="Inter Display,Inter" font-weight="800" font-size="40" fill="${CORAL}">No. 1.115.674</text></g>`:''}
    <rect width="1920" height="1080" fill="url(#vig)"/>
    <text x="1890" y="1065" text-anchor="end" font-family="Inter" font-size="20" fill="#cfe" opacity=".6">Kaynak: ABD Patent Ofisi, US 1.115.674 (kamu malı)</text>
    ${sub(s)}`; }},

 '36':{DUR:7.0, render(t){
   // 1.500 $ (Mary) → 15.000.000 $ (şirket) sayaç
   const a=back(clamp(seg(t,0.2,0.7))), aO=clamp(seg(t,0.2,0.5));
   const cntK=ease(seg(t,2.2,4.6)), val=1500+(15000000-1500)*Math.pow(cntK,2.2);
   const b=back(clamp(seg(t,1.8,2.2))), bO=clamp(seg(t,1.8,2.0));
   const done=t>4.6;
   let shx=0,shy=0; if(t>4.6&&t<4.95){const k=1-seg(t,4.6,4.95);shx=Math.sin(t*90)*10*k;shy=Math.cos(t*70)*8*k;}
   let coins='';
   if(t>2.2){ for(let i=0;i<26;i++){const ph=(t*1.4+i*0.137)%1; const x=((i*197)%1840)+40; const y=-60+ph*1200; coins+=`<g transform="translate(${x},${y}) rotate(${ph*720+i*40})"><ellipse rx="26" ry="26" fill="${GOLD}" stroke="${INK}" stroke-width="4"/><text y="11" text-anchor="middle" font-family="Inter" font-weight="900" font-size="30" fill="${INK}">$</text></g>`;} }
   const s = t<0.3?'':(t<2.2?'Mary patenti sattı: 1.500 dolar.':(t<5.2?'Şirket ise… söylenene göre 15 milyon dolardan fazla kazandı.':'Mary\'nin payı: binde biri bile değil.'));
   return `${DEFS}<rect width="1920" height="1080" fill="url(#tealbg)"/>
    <g opacity=".1">${Array.from({length:20},(_,i)=>`<path d="M960,540 L${960+Math.cos(i/20*6.283+t*0.15)*1600},${540+Math.sin(i/20*6.283+t*0.15)*1600}" stroke="#fff" stroke-width="60"/>`).join('')}</g>
    ${coins}
    <g transform="translate(${shx},${shy})">
     <g transform="translate(960,300) scale(${a})" opacity="${aO}">
      <text x="0" y="-120" text-anchor="middle" font-family="Caladea,serif" font-style="italic" font-weight="700" font-size="52" fill="${CREAM}">Mary'nin aldığı</text>
      <text x="0" y="40" text-anchor="middle" font-family="Inter Display,Inter" font-weight="900" font-size="150" fill="${CREAM}" stroke="${INK}" stroke-width="14" paint-order="stroke">1.500 $</text>
     </g>
     <g opacity="${bO}"><path d="M960,380 L960,470" stroke="${GOLD}" stroke-width="20" stroke-linecap="round"/><path d="M915,460 L960,515 L1005,460 Z" fill="${GOLD}"/></g>
     <g transform="translate(960,700) scale(${b*(done?1+0.06*Math.sin(seg(t,4.6,5.0)*Math.PI):1)})" opacity="${bO}">
      <text x="0" y="-130" text-anchor="middle" font-family="Caladea,serif" font-style="italic" font-weight="700" font-size="52" fill="${CREAM}">Şirketin kazandığı*</text>
      <text x="0" y="60" text-anchor="middle" font-family="Inter Display,Inter" font-weight="900" font-size="200" fill="${GOLD}" stroke="${INK}" stroke-width="14" paint-order="stroke">${fmt(val)} $</text>
     </g>
    </g>
    <text x="1890" y="1065" text-anchor="end" font-family="Inter" font-size="20" fill="#cfe" opacity=".7">*Söylenene göre, sonraki 30 yılda</text>
    <rect width="1920" height="1080" filter="url(#paper)"/>
    ${sub(s)}`; }}
};
const S=SCENES[SC]; window.DUR=S.DUR;
window.render=t=>{const f=Math.min(clamp(t/0.3),clamp((S.DUR-t)/0.3));document.getElementById('sv').innerHTML=S.render(t)+`<rect width="1920" height="1080" fill="#000" opacity="${1-f}"/>`;};
</script></body></html>
